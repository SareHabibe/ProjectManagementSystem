<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="userList.css">
</head>

<body>
    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="close-btn" onclick="toggleSidebarUserList()">&times;</a>

        <h2 class="sidebar-title"> Üye İşlemleri </h2>
        <button class="logout-btn" onclick="logout()">Çıkış Yap</button>
    </div>
    
    <div class="menu-btn" onclick="toggleSidebarUserList()"> &#9776; </div>

    <div class="headerContainer">
        <header class="header">
            <h2>Proje Yönetim Sistemi</h2>
             <ul class="panel">
                
                <li>
                    <a href="../../MainWindow/MainWindow.html">Ana Sayfa</a>
                </li>
                
                <li class="dropdown">
                    <a href="../../Users/userList/userList.html">Üyeler</a>
                </li>
                
                
                <li class="dropdown">
                <a href="../../Projects/projectList/projectList.html">Projeler</a>

                </li>

                <li class="dropdown">
                <a href="../../Tasks/taskList/taskList.html">Görevler</a>
                </li>

                <li class="dropdown">
                <a href="../../Comments/comments/Comments.html">Yorumlar</a>
                </li>
            </ul>
        </header>
    </div>

    <main class="content-wrapper">
        <div class="table-information">
        </div>

        <section class="filter-bar">
            <input type="text" id="searchNameEmail" placeholder="İsim Ara" onkeyup="applyFilter()">

            <select id="roleFilter">
                <option value="">Rol Seçiniz</option>
                <option value="Admin">Admin</option>
                <option value="ProjectManager">Project Manager</option>
                <option value="TeamMember">Team Member</option>
                <option value="Viewer">Viewer</option>
            </select>

            <select id="statusFilter">
                <option value="">Durum Seçiniz</option>
                <option value="active">Aktif</option>
                <option value="passive">Pasif</option>
            </select>

            <button onclick="applyFilter()">Filtrele</button>

            <button class="action-btn" onclick="openAddUserModal()">+ Yeni Üye Ekle</button>
        </section>
    </div>

    <div id="addUserModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="modal-close-btn" onclick="closeAddUserModal()">&times;</span>
            <h3>Yeni Üye Kaydı</h3>
            
            <form id="addUserForm" onsubmit="AddRegister(event)">
                <div class="form-group">
                    <label>İsim</label>
                    <input type="text" id="newFirstName" required class="modal-input">
                </div>
                <div class="form-group">
                    <label>Soyisim</label>
                    <input type="text" id="newLastName" required class="modal-input">
                </div>
                
                <div class="form-group">
                    <label>E-posta</label>
                    <input type="email" id="newEmail" required class="modal-input">
                </div>

                <div class="form-group">
                    <label>Şifre</label>
                    <input type="password" id="newPassword" required class="modal-input">
                </div>

                <div class="form-group">
                    <label>Rol</label>
                    <select id="newRole" class="modal-input">
                        <option value="0">Admin</option>
                        <option value="1">Project Manager</option>
                        <option value="2">Team Member</option>
                        <option value="3">Viewer</option>
                    </select>
                </div>
               

                <button type="submit" class="btn-save">Kaydet</button>
            </form>
        </div>
    </div>

        <table class="userList-table">
            <thead>
                <tr>
                    <th>İsim</th>
                    <th>Soyisim</th>
                    <th>E-posta</th>
                    <th>Rol</th>
                    <th>Durum</th>
                </tr>
            </thead>
            <tbody id="userListTableBody">
            </tbody>
        </table>
        
        <div class="pagination-container">
            <button id="prevBtn" onclick="prevPage()">Önceki</button>
            <span id="pageInfo" style="color: black;">Sayfa 1</span>
            <button id="nextBtn" onclick="nextPage()">Sonraki</button>
        </div>
    </main>
    <script src="userList.js"></script> 
    
    <script>
        window.onload = () => {
            filterUsers();
        };
    </script>
</body>
</html>
