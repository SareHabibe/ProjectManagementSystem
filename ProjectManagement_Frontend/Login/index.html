<!DOCTYPE html>
<html lang="tr">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="LoginPage.css">
    </head>
    <body>

      <div class="login-header">  
        <h2 style="z-index: 1500; font-size:230%; width: 100%; zoom: 0.50; margin-top: 35%;"> Giriş Yap</h2>
      </div>
           
        <div class="login-container">  
            <form id="loginForm">
                <input  type="email" id="loginEmail" placeholder="E-posta" required>
                <input type="password" id="loginPassword" placeholder="Şifre" required>
                <button type="submit">Giriş Yap</button>
            </form>
        </div>
        <script src="auth.js"></script>
    </body>
</html>
